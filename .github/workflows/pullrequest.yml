name: Version Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engines:
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Verify engines.vscode matches @types/vscode
        shell: pwsh
        run: |
          $package = Get-Content .\package.json | ConvertFrom-Json
          $engines = $package.engines.vscode
          $types = $package.devDependencies."@types/vscode"
          Write-Host "engines.vscode : $engines"
          Write-Host "@types/vscode  : $types"
          if ($engines -ne $types) {
              throw [System.Exception]("engines.vscode ($engines) does not match @types/vscode ($types). ❌ Keep them identical so the API surface compiled against is the one declared as supported.")
          }
          Write-Host "Pass ✅"

  lint:
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP "eslint-report.json"
          $PSNativeCommandUseErrorActionPreference = $false
          pnpm exec eslint src --format json --output-file "$reportPath"
          $eslintExit = $LASTEXITCODE

          if (-not (Test-Path $reportPath)) {
              throw [System.Exception]("ESLint exited $eslintExit without writing a report. ❌")
          }

          $root = (Get-Location).Path
          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          $findings = foreach ($file in $report) {
              $relative = [System.IO.Path]::GetRelativePath($root, $file.filePath).Replace("\", "/")
              foreach ($m in $file.messages) {
                  $level = if ($m.severity -eq 2) { "error" } else { "warning" }
                  # Parse failures are fatal severity-2 messages carrying no ruleId.
                  $rule = if ([string]::IsNullOrEmpty($m.ruleId)) { "eslint" } else { $m.ruleId }
                  [pscustomobject]@{
                      File    = $relative
                      Line    = $m.line
                      Column  = $m.column
                      Level   = $level
                      Rule    = $rule
                      Message = $m.message
                  }
              }
          }
          $findings = @($findings)
          $errors = @($findings | Where-Object { $_.Level -eq "error" })
          $warnings = @($findings | Where-Object { $_.Level -eq "warning" })

          # Inline annotations on the PR diff. GitHub needs %, CR and LF escaped.
          foreach ($f in $findings) {
              $text = $f.Message.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
              Write-Host "::$($f.Level) file=$($f.File),line=$($f.Line),col=$($f.Column),title=$($f.Rule)::$text"
          }

          $summary = [System.Text.StringBuilder]::new()
          [void]$summary.AppendLine("## ESLint")
          [void]$summary.AppendLine("")
          [void]$summary.AppendLine("$($errors.Count) error(s), $($warnings.Count) warning(s).")
          if ($findings.Count -gt 0) {
              [void]$summary.AppendLine("")
              [void]$summary.AppendLine("| | File | Line | Rule | Message |")
              [void]$summary.AppendLine("| --- | --- | --- | --- | --- |")
              foreach ($f in $findings) {
                  $icon = if ($f.Level -eq "error") { "❌" } else { "⚠️" }
                  $cell = $f.Message.Replace("|", "\|")
                  [void]$summary.AppendLine("| $icon | $($f.File) | $($f.Line) | $($f.Rule) | $cell |")
              }
          }
          $summary.ToString() | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          if ($errors.Count -gt 0) {
              throw [System.Exception]("ESLint found $($errors.Count) error(s). ❌")
          }
          Write-Host "No ESLint errors. Pass ✅ ($($warnings.Count) warning(s) ignored.)"
